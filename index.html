            bindCameraControls() {
                document.querySelectorAll('[data-cam]').forEach((el) => {
                    el.oninput = () => {
                        const key = el.dataset.cam;
                        const v = parseFloat(el.value);
                        if (Number.isNaN(v)) return;
                        document.querySelectorAll(`[data-cam="${key}"]`).forEach((n) => { n.value = v; });
                        this.applyCamera();
                    };
                });
            }

            camValue(key, fallback) {
                const el = document.querySelector(`input[type="number"][data-cam="${key}"]`);
                const v = el ? parseFloat(el.value) : NaN;
                return Number.isNaN(v) ? fallback : v;
            }

            currentCamera() {
                const d = this.camDefaults;
                return {
                    angle: this.camValue('angle', d.angle),
                    zoom: this.camValue('zoom', d.zoom)
                };
            }

            writeCameraInputs(cam) {
                if (!cam || typeof cam !== 'object') return;
                ['angle', 'zoom'].forEach((key) => {
                    if (cam[key] == null || Number.isNaN(Number(cam[key]))) return;
                    document.querySelectorAll(`[data-cam="${key}"]`).forEach((el) => {
                        el.value = cam[key];
                    });
                });
            }

            readSavedCamera() {
                try {
                    const cam = JSON.parse(localStorage.getItem('tesla_cam_v3') || localStorage.getItem('tesla_cam_saved') || 'null');
                    if (cam && typeof cam === 'object') return cam;
                } catch (_) {}
                return null;
            }

            applyCamera() {
                const cam = this.currentCamera();
                this.driveZoom = Math.min(19, Math.max(13, cam.zoom));
                const extra = Math.max(0, cam.zoom - 18);
                const scale = 1.15 + extra * 0.28;

                const camEl = this.camEl();
                if (camEl) {
                    camEl.style.setProperty('--cam-angle', cam.angle + 'deg');
                    camEl.style.setProperty('--cam-scale', String(scale));
                }

                if (this.isNavigating && this.currentPos) this.applyDriveView(false);
            }

            saveCamera() {
                const cam = this.currentCamera();
                try {
                    localStorage.setItem('tesla_cam_v3', JSON.stringify(cam));
                } catch (_) {
                    this.notify('❌ Could not save camera', 'error');
                    return;
                }
                this.applyCamera();
                this.notify('💾 Camera saved', 'success');
            }

            restoreCamera() {
                const saved = this.readSavedCamera();
                if (saved) this.writeCameraInputs(saved);
                this.applyCamera();
            }

            resetCamera() {
                this.writeCameraInputs(this.camDefaults);
                this.applyCamera();
                this.notify('Camera reset to default', 'info');
            }
            
            async calculateRoute() {
                const fromValue = document.getElementById('fromInput').value.trim();
                const toValue = document.getElementById('toInput').value.trim();
                
                let startCoords = fromValue ? await this.geocodeAddress(fromValue) : this.currentPos;
                
                if (!startCoords) {
                    this.notify('⚠️ Enter start or enable GPS', 'error');
                    return;
                }
                
                if (!toValue) {
                    this.notify('⚠️ Enter destination', 'error');
                    return;
                }
                
                this.notify('🔍 Finding destination...', 'info');
                const destCoords = await this.geocodeAddress(toValue);
                if (!destCoords) {
                    this.notify('❌ Destination not found', 'error');
                    return;
                }
                
                this.createRoute(startCoords, destCoords);
            }
            
            async geocodeAddress(address) {
                try {
                    await new Promise(resolve => setTimeout(resolve, 300));
                    
                    if (this.searchMode === 'yandex') {
                        const url = `https://geocode-maps.yandex.ru/1.x/?apikey=&geocode=${encodeURIComponent(address)}&format=json&lang=en_US`;
                        const res = await fetch(url);
                        if (!res.ok) return this.geocodeWithOSM(address);
                        const data = await res.json();
                        const geoObj = data?.response?.GeoObjectCollection?.featureMember?.[0]?.GeoObject;
                        if (!geoObj) return this.geocodeWithOSM(address);
                        const coords = geoObj.Point.pos.split(' ');
                        return [parseFloat(coords[1]), parseFloat(coords[0])];
                    } else {
                        return this.geocodeWithOSM(address);
                    }
                } catch {
                    return this.geocodeWithOSM(address);
                }
            }
            
            async geocodeWithOSM(address) {
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&limit=1&countrycodes=am`, {
                        headers: { 'User-Agent': 'TeslaNavigator/1.0' }
                    });
                    if (!res.ok) return null;
                    const results = await res.json();
                    return results.length > 0 ? [parseFloat(results[0].lat), parseFloat(results[0].lon)] : null;
                } catch {
                    return null;
                }
            }
            
            createRoute(start, end, options = {}) {
                const silent = !!options.silent;
                const keepNavigating = !!options.keepNavigating;
                
                this.destinationPos = end;
                
                if (this.startMarker) this.map.removeLayer(this.startMarker);
                if (this.destMarker) this.map.removeLayer(this.destMarker);
                if (this.routing) this.map.removeControl(this.routing);
                if (this.remainingLine) {
                    this.map.removeLayer(this.remainingLine);
                    this.remainingLine = null;
                }
                this.routeCoords = [];
                this.routeProgressIndex = 0;
                
                if (!silent) this.notify('📍 Calculating route...', 'info');
                
                this.destMarker = L.marker(end, {
                    icon: L.divIcon({
                        html: '<div style="width:20px;height:20px;background:#e31937;border:3px solid white;border-radius:50%;box-shadow:0 0 10px rgba(227,25,55,0.8);"></div>',
                        iconSize: [20, 20],
                        className: ''
                    })
                }).addTo(this.map);
                
                return new Promise((resolve) => {
                    this.routing = L.Routing.control({
                        waypoints: [L.latLng(start), L.latLng(end)],
                        routeWhileDragging: false,
                        showAlternatives: false,
                        fitSelectedRoutes: false,
                        addWaypoints: false,
                        lineOptions: {
                            styles: [{ color: '#3e6ae1', weight: 7, opacity: 0 }]
                        },
                        createMarker: () => null,
                        router: L.Routing.osrmv1({
                            serviceUrl: 'https://router.project-osrm.org/route/v1'
                        })
                    }).addTo(this.map);
                    
                    this.routing.on('routesfound', (e) => {
                        const route = e.routes[0];
                        this.currentRoute = route;
                        this.instructions = route.instructions || [];
                        this.currentInstruction = 0;
                        
                        this.routeCoords = (route.coordinates || []).map(c => [c.lat, c.lng]);
                        this.routeProgressIndex = 0;
                        this.offRouteHits = 0;
                        this.syncSimToRoute();
                        
                        if (this.remainingLine) this.map.removeLayer(this.remainingLine);
                        this.remainingLine = L.polyline(this.routeCoords, {
                            color: '#3e6ae1',
                            weight: 7,
                            opacity: 0.95,
                            lineJoin: 'round',
                            lineCap: 'round'
                        }).addTo(this.map);
                        
                        this.baseDuration = Math.round(route.summary.totalTime / 60);
                        this.updateDurationDisplay();
                        
                        if (!keepNavigating) {
                            document.getElementById('startNavBtn').classList.remove('hidden');
                            if (!this.isNavigating && this.routeCoords.length) {
                                this.map.fitBounds(this.remainingLine.getBounds(), { padding: [40, 40], maxZoom: 15 });
                            }
                            this.notify('✅ Route ready! Tap START', 'success');
                        } else {
                            if (this.isNavigating) {
                                this._lastGoodBearing = null;
                                const rb = this.getRouteAheadBearing();
                                if (rb !== null) this.setHeading(rb, { snap: true, force: true });
                                this.trimPassedRoute();
                                this.applyDriveView(false);
                                this.notify('✅ New route ready', 'success');
                            }
                        }
                        
                        resolve(route);
                    });
                    
                    this.routing.on('routingerror', () => {
                        if (!silent) this.notify('❌ Routing failed', 'error');
                        resolve(null);
                    });
                });
            }
            
            updateDurationDisplay() {
                const adjustedDuration = Math.round(this.baseDuration * this.trafficMultiplier);
                const eta = new Date(Date.now() + adjustedDuration * 60000).toLocaleTimeString('en-US', {
                    hour: 'numeric',
                    minute: '2-digit',
                    hour12: true
                });
                
                document.getElementById('navTime').textContent = adjustedDuration + ' min';
                document.getElementById('navETA').textContent = eta;
            }
            
            async startNavigation() {
                if (!this.routing || !this.currentRoute) {
                    this.notify('Calculate route first', 'error');
                    return;
                }
                
                console.log('=== STARTING NAVIGATION ===');
                console.log('Current position:', this.currentPos);
                
                this.isNavigating = true;
                this.routeProgressIndex = 0;
                this.offRouteHits = 0;
                
                document.getElementById('navBar').classList.remove('hidden');
                document.getElementById('turnInstruction').classList.remove('hidden');
                document.getElementById('controlPanel').classList.add('hidden-ui');
                
                this.compassMode = true;
                document.getElementById('compassBtn').classList.add('active');
                
                // Face the road you should follow, not the phone's compass.
                this._lastGoodBearing = null;
                const rb = this.getRouteAheadBearing();
                if (rb !== null) this.setHeading(rb, { snap: true, force: true });
                
                this.setDrive3D(true);
                this.trimPassedRoute();
                this.applyDriveView(true);
                
                this.updateNavigationInfo();
                this.notify('🧭 Looking straight along your route', 'success');
            }
            
            stopNavigation() {
                console.log('=== STOPPING NAVIGATION ===');
                
                this.isNavigating = false;
                this.isRerouting = false;
                this.offRouteHits = 0;
                clearTimeout(this._driveViewTimer);
                clearTimeout(this._driveViewTimer2);
                
                document.getElementById('navBar').classList.add('hidden');
                document.getElementById('turnInstruction').classList.add('hidden');
                document.getElementById('controlPanel').classList.remove('hidden-ui');
                
                this.compassMode = false;
                document.getElementById('compassBtn').classList.remove('active');
                this.setDrive3D(false);
                this.resetToNorth();
                
                if (this.remainingLine && this.routeCoords.length) {
                    this.routeProgressIndex = 0;
                    this.remainingLine.setLatLngs(this.routeCoords);
                }
                
                this.notify('Navigation stopped', 'info');
            }
            
            center() {
                if (this.currentPos) {
                    if (this.isNavigating) {
                        this.applyDriveView(false);
                    } else {
                        this.map.setView(this.currentPos, 16);
                    }
                    this.notify('📍 Centered', 'success');
                } else {
                    this.notify('⚠️ No GPS', 'error');
                }
            }
            
            clear() {
                this.stopNavigation();
                
                if (this.routing) this.map.removeControl(this.routing);
                if (this.startMarker) this.map.removeLayer(this.startMarker);
                if (this.destMarker) this.map.removeLayer(this.destMarker);
                if (this.remainingLine) this.map.removeLayer(this.remainingLine);
                
                this.routing = null;
                this.currentRoute = null;
                this.startMarker = null;
                this.destMarker = null;
                this.remainingLine = null;
                this.routeCoords = [];
                this.routeProgressIndex = 0;
                this.destinationPos = null;
                this.offRouteHits = 0;
                this.isRerouting = false;
                this.instructions = [];
                this.baseDuration = 0;
                
                document.getElementById('startNavBtn').classList.add('hidden');
                document.getElementById('fromInput').value = '';
                document.getElementById('toInput').value = '';
                
                this.notify('✖️ Cleared', 'info');
            }
            
            restoreDeveloperMode() {
                let unlocked = false;
                try { unlocked = sessionStorage.getItem('tesla_dev_mode') === '1'; } catch (_) {}
                this.setDeveloperMode(unlocked, { quiet: true });
            }

            onLogoTap() {
                const now = Date.now();
                this.logoTaps = this.logoTaps.filter(t => now - t < 2500);
                this.logoTaps.push(now);
                if (this.logoTaps.length >= 5) {
                    this.logoTaps = [];
                    if (this.developerMode) {
                        this.lockDeveloperMode();
                    } else {
                        this.openDevModal();
                    }
                }
            }

            openDevModal() {
                this.devPin = '';
                this.updateDevDots();
                document.getElementById('devModal').classList.remove('hidden');
            }

            closeDevModal() {
                this.devPin = '';
                this.updateDevDots();
                document.getElementById('devModal').classList.add('hidden');
            }

            updateDevDots() {
                document.querySelectorAll('#devDots .dev-dot').forEach((dot, i) => {
                    dot.classList.toggle('filled', i < this.devPin.length);
                });
            }

            onDevKey(key) {
                if (key === 'cancel') {
                    this.closeDevModal();
                    return;
                }
                if (key === 'del') {
                    this.devPin = this.devPin.slice(0, -1);
                    this.updateDevDots();
                    return;
                }
                if (!/^[0-9]$/.test(key) || this.devPin.length >= 4) return;
                this.devPin += key;
                this.updateDevDots();
                if (this.devPin.length === 4) {
                    if (this.devPin === this.devPasscode) {
                        this.closeDevModal();
                        this.setDeveloperMode(true);
                    } else {
                        this.devPin = '';
                        this.updateDevDots();
                        this.notify('❌ Wrong passcode', 'error');
                    }
                }
            }

            setDeveloperMode(enabled, options = {}) {
                this.developerMode = !!enabled;
                document.body.classList.toggle('dev-mode', this.developerMode);
                const simBtn = document.getElementById('simToggleBtn');
                simBtn.classList.toggle('hidden', !this.developerMode);
                if (!this.developerMode) {
                    this.pauseSim();
                    document.getElementById('simPanel').classList.add('hidden');
                    simBtn.classList.remove('sim-on');
                    try { sessionStorage.removeItem('tesla_dev_mode'); } catch (_) {}
                    if (!options.quiet) this.notify('Developer mode off', 'info');
                } else {
                    try { sessionStorage.setItem('tesla_dev_mode', '1'); } catch (_) {}
                    if (!options.quiet) this.notify('🛠️ Developer mode on', 'success');
                }
            }

            lockDeveloperMode() {
                this.setDeveloperMode(false);
            }

            teslaCarHtml() {
                const pack = this.carCatalog('mark')[this.carStyle] || this.carCatalog('mark').halo;
                return pack.html;
            }

            carCatalog(ns = 'c') {
                return {
                    pulse: {
                        name: 'Pulse',
                        html: `<svg viewBox="0 0 78 78" xmlns="http://www.w3.org/2000/svg" aria-label="Pulse">
                            <defs>
                              <radialGradient id="pg-${ns}" cx="50%" cy="58%" r="48%">
                                <stop offset="0%" stop-color="#7aa2ff" stop-opacity="0.55"/>
                                <stop offset="100%" stop-color="#3e6ae1" stop-opacity="0"/>
                              </radialGradient>
                            </defs>
                            <circle cx="39" cy="44" r="28" fill="url(#pg-${ns})"/>
                            <path d="M39 16 L58 52 H20 Z" fill="#3e6ae1" stroke="#d6e4ff" stroke-width="2" stroke-linejoin="round"/>
                            <path d="M39 24 L51 48 H27 Z" fill="#0b1a3a"/>
                            <circle cx="39" cy="40" r="3.2" fill="#8ec8ff"/>
                          </svg>`
                    },
                    cyber: {
                        name: 'Cyber',
                        html: `<svg viewBox="0 0 78 78" xmlns="http://www.w3.org/2000/svg" aria-label="Cyber">
                            <path d="M16 50 L24 28 H54 L62 50 Z" fill="#c5c8cc" stroke="#3a3d42" stroke-width="1.6" stroke-linejoin="round"/>
                            <path d="M22 48 L28 32 H50 L56 48 Z" fill="#8e949c"/>
                            <rect x="20" y="46" width="38" height="5" rx="1" fill="#111"/>
                            <rect x="22" y="47.2" width="12" height="2.4" fill="#ff3b30"/>
                            <rect x="44" y="47.2" width="12" height="2.4" fill="#ff3b30"/>
                            <path d="M30 32 L39 22 L48 32 Z" fill="#6b7078"/>
                            <rect x="18" y="50" width="8" height="6" rx="1" fill="#1a1a1a"/>
                            <rect x="52" y="50" width="8" height="6" rx="1" fill="#1a1a1a"/>
                          </svg>`
                    },
                    ember: {
                        name: 'Ember',
                        html: `<svg viewBox="0 0 78 78" xmlns="http://www.w3.org/2000/svg" aria-label="Ember">
                            <defs>
                              <linearGradient id="eg-${ns}" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="#2a1114"/>
                                <stop offset="100%" stop-color="#090607"/>
                              </linearGradient>
                            </defs>
                            <ellipse cx="39" cy="56" rx="18" ry="4" fill="rgba(0,0,0,0.35)"/>
                            <path d="M18 48 C20 30 28 22 39 22 C50 22 58 30 60 48 C58 54 48 58 39 58 C30 58 20 54 18 48Z" fill="url(#eg-${ns})" stroke="#ff4d2e" stroke-width="1.4"/>
                            <path d="M24 36 C28 28 34 26 39 26 C44 26 50 28 54 36 Z" fill="#3a1518"/>
                            <rect x="21" y="46" width="36" height="4" rx="2" fill="#ff2a1a"/>
                            <rect x="23" y="47" width="32" height="2" rx="1" fill="#ffd0a8"/>
                            <circle cx="24" cy="52" r="3" fill="#1a1a1a"/>
                            <circle cx="54" cy="52" r="3" fill="#1a1a1a"/>
                          </svg>`
                    },
                    halo: {
                        name: 'Halo',
                        html: `<svg viewBox="0 0 78 78" xmlns="http://www.w3.org/2000/svg" aria-label="Halo">
                            <defs>
                              <radialGradient id="hg-${ns}" cx="50%" cy="50%" r="50%">
                                <stop offset="0%" stop-color="#fff4c2" stop-opacity="0.9"/>
                                <stop offset="55%" stop-color="#ffcc33" stop-opacity="0.25"/>
                                <stop offset="100%" stop-color="#ffcc33" stop-opacity="0"/>
                              </radialGradient>
                            </defs>
                            <circle cx="39" cy="40" r="30" fill="url(#hg-${ns})"/>
                            <circle cx="39" cy="40" r="16" fill="none" stroke="#ffe27a" stroke-width="2.4"/>
                            <path d="M39 24 L50 48 L39 43 L28 48 Z" fill="#111" stroke="#ffe27a" stroke-width="1.6" stroke-linejoin="round"/>
                            <circle cx="39" cy="36" r="2.6" fill="#ffe27a"/>
                          </svg>`
                    }
                };
            }

            renderCarPicker() {
                const wrap = document.getElementById('carPicker');
                if (!wrap) return;
                const catalog = this.carCatalog('pick');
                wrap.innerHTML = Object.keys(catalog).map((id) => {
                    const c = catalog[id];
                    const on = id === this.carStyle ? ' active' : '';
                    return `<button type="button" class="car-opt${on}" data-car="${id}" title="${c.name}">${c.html}<span>${c.name}</span></button>`;
                }).join('');
                wrap.onclick = (e) => {
                    const btn = e.target.closest('[data-car]');
                    if (btn) this.setCarStyle(btn.dataset.car);
                };
            }

            setCarStyle(id) {
                const catalog = this.carCatalog('pick');
                if (!catalog[id]) return;
                this.carStyle = id;
                try { localStorage.setItem('tesla_car_style', id); } catch (_) {}
                document.querySelectorAll('.car-opt').forEach((btn) => {
                    btn.classList.toggle('active', btn.dataset.car === id);
                });
                this.applyCarIcon();
                this.notify('🚗 Car: ' + catalog[id].name, 'success');
            }

            applyCarIcon() {
                if (!this.userMarker) return;
                const root = this.userMarker.getElement();
                const cursor = root && root.querySelector('.user-cursor');
                if (cursor) {
                    cursor.innerHTML = this.teslaCarHtml();
                    cursor.className = 'user-cursor car-' + this.carStyle;
                } else {
                    this.userMarker.setIcon(L.divIcon({
                        html: `<div class="user-cursor car-${this.carStyle}">${this.teslaCarHtml()}</div>`,
                        iconSize: [78, 78],
                        iconAnchor: [39, 42],
                        className: 'user-cursor-marker'
                    }));
                }
                this.updateCursorRotation();
            }

            fakeGeoPosition(latlng, speedMps, heading) {
                return {
                    coords: {
                        latitude: latlng[0],
                        longitude: latlng[1],
                        accuracy: 5,
                        altitude: null,
                        altitudeAccuracy: null,
                        heading: heading,
                        speed: speedMps
                    },
                    timestamp: Date.now()
                };
            }

            seedFallbackPosition() {
                if (this.currentPos) return;
                this.updatePosition(this.fakeGeoPosition([40.1776, 44.5126], 0, 0));
                if (this.developerMode) {
                    document.getElementById('fromInput').placeholder = 'From: SIM start';
                }
            }

            toggleSimPanel() {
                if (!this.developerMode) return;
                const panel = document.getElementById('simPanel');
                const btn = document.getElementById('simToggleBtn');
                const open = panel.classList.contains('hidden');
                panel.classList.toggle('hidden', !open);
                btn.classList.toggle('sim-on', open);
                if (open) {
                    this.seedFallbackPosition();
                    this.setSimMinimized(false);
                }
            }

            setSimMinimized(on) {
                const panel = document.getElementById('simPanel');
                if (!panel) return;
                panel.classList.toggle('minimized', !!on);
            }

            syncSimToRoute() {
                if (!this.routeCoords.length) {
                    this.simIndex = 0;
                    this.simT = 0;
                    return;
                }
                const origin = this.currentPos || this.routeCoords[0];
                let closest = 0;
                let closestDist = Infinity;
                for (let i = 0; i < this.routeCoords.length; i++) {
                    const d = this.calculateDistance(origin, this.routeCoords[i]);
                    if (d < closestDist) {
                        closestDist = d;
                        closest = i;
                    }
                }
                this.simIndex = Math.min(closest, this.routeCoords.length - 2);
                this.simT = 0;
                this.simOffRoute = false;
            }

            interpolate(a, b, t) {
                return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
            }

            offsetByMeters(latlng, headingDeg, meters) {
                const R = 6371000;
                const brng = headingDeg * Math.PI / 180;
                const lat1 = latlng[0] * Math.PI / 180;
                const lon1 = latlng[1] * Math.PI / 180;
                const lat2 = Math.asin(Math.sin(lat1) * Math.cos(meters / R) +
                    Math.cos(lat1) * Math.sin(meters / R) * Math.cos(brng));
                const lon2 = lon1 + Math.atan2(
                    Math.sin(brng) * Math.sin(meters / R) * Math.cos(lat1),
                    Math.cos(meters / R) - Math.sin(lat1) * Math.sin(lat2)
                );
                return [lat2 * 180 / Math.PI, lon2 * 180 / Math.PI];
            }

            advanceAlongRoute(meters) {
                if (!this.routeCoords.length || this.simIndex >= this.routeCoords.length - 1) {
                    return this.currentPos;
                }
                let remaining = meters;
                while (remaining > 0 && this.simIndex < this.routeCoords.length - 1) {
                    const a = this.routeCoords[this.simIndex];
                    const b = this.routeCoords[this.simIndex + 1];
                    const segLen = Math.max(this.calculateDistance(a, b) * 1000, 0.01);
                    const left = segLen * (1 - this.simT);
                    if (remaining >= left) {
                        remaining -= left;
                        this.simIndex += 1;
                        this.simT = 0;
                    } else {
                        this.simT += remaining / segLen;
                        remaining = 0;
                    }
                }
                if (this.simIndex >= this.routeCoords.length - 1) {
                    return this.routeCoords[this.routeCoords.length - 1];
                }
                return this.interpolate(this.routeCoords[this.simIndex], this.routeCoords[this.simIndex + 1], this.simT);
            }

            setSimState(text) {
                const el = document.getElementById('simState');
                if (el) el.textContent = text;
                const badge = document.querySelector('.data-badge');
                if (badge) badge.textContent = this.simulating ? '🎮 SIM DRIVE' : '🧭 COMPASS NAV';
            }

            async startSim() {
                if (!this.developerMode) return;
                this.seedFallbackPosition();
                if (!this.routeCoords.length) {
                    this.notify('Set a destination (or Demo route), then Play', 'error');
                    return;
                }

                this.simulating = true;
                this.simOffRoute = false;
                this.syncSimToRoute();
                this.lastSimTick = performance.now();
                this.setSimState('driving');
                document.getElementById('simPanel').classList.remove('hidden');
                document.getElementById('simToggleBtn').classList.add('sim-on');

                if (!this.isNavigating) {
                    await this.startNavigation();
                }

                if (this.simTimer) {
                    cancelAnimationFrame(this.simTimer);
                    this.simTimer = null;
                }
                this.lastSimTick = performance.now();
                const loop = (now) => {
                    if (!this.simulating) return;
                    const dt = Math.min((now - this.lastSimTick) / 1000, 0.05);
                    this.lastSimTick = now;
                    this.simTick(dt);
                    this.simTimer = requestAnimationFrame(loop);
                };
                this.simTimer = requestAnimationFrame(loop);
                this.notify('🎮 Sim driving at ' + this.simSpeedKmh + ' km/h', 'success');
            }

            pauseSim() {
                this.simulating = false;
                if (this.simTimer) {
                    cancelAnimationFrame(this.simTimer);
                    this.simTimer = null;
                }
                this.setSimState('paused');
            }

            resetSim() {
                this.pauseSim();
                this.simOffRoute = false;
                if (this.routeCoords.length) {
                    this.simIndex = 0;
                    this.simT = 0;
                    this.routeProgressIndex = 0;
                    const start = this.routeCoords[0];
                    const heading = this.routeCoords[1] ? this.bearingBetween(this.routeCoords[0], this.routeCoords[1]) : 0;
                    this.lastPos = null;
                    this.updatePosition(this.fakeGeoPosition(start, 0, heading));
                }
                this.notify('↺ Sim reset to route start', 'info');
            }

            simTick(dt) {
                if (!this.currentPos) return;
                const speedMps = this.simSpeedKmh / 3.6;
                const step = speedMps * dt;
                let nextPos;
                let heading = this.heading;

                if (this.simOffRoute) {
                    heading = this.simHeading;
                    nextPos = this.offsetByMeters(this.currentPos, heading, step);
                } else {
                    nextPos = this.advanceAlongRoute(step);
                    const nextPt = this.routeCoords[this.simIndex + 1];
                    if (nextPt) {
                        heading = this.bearingBetween(this.routeCoords[this.simIndex], nextPt);
                    }
                    const atEnd = this.simIndex >= this.routeCoords.length - 1;
                    const remainingM = this.destinationPos
                        ? this.calculateDistance(nextPos, this.destinationPos) * 1000
                        : Infinity;
                    if (atEnd && remainingM < 25) {
                        this.pauseSim();
                        this.notify('🎯 Sim reached destination', 'success');
                    }
                }

                this.updatePosition(this.fakeGeoPosition(nextPos, speedMps, heading));
            }

            deviateOffRoute() {
                if (!this.developerMode) return;
                this.seedFallbackPosition();
                if (!this.currentPos) return;
                const sideHeading = (this.heading + 90) % 360;
                const off = this.offsetByMeters(this.currentPos, sideHeading, 25);
                this.simOffRoute = true;
                this.simHeading = this.heading;
                this.lastPos = null;
                this.updatePosition(this.fakeGeoPosition(off, this.simSpeedKmh / 3.6, this.simHeading));
                this.notify('↘ Off-route +25m — should reroute', 'info');
            }

            async loadDemoRoute() {
                if (!this.developerMode) return;
                this.pauseSim();
                const start = [40.1776, 44.5126]; // Republic Square
                const end = [40.1912, 44.5158];   // Cascade
                this.lastPos = null;
                this.updatePosition(this.fakeGeoPosition(start, 0, 0));
                document.getElementById('fromInput').value = 'Republic Square';
                document.getElementById('toInput').value = 'Cascade';
                this.notify('📍 Demo: Republic Square → Cascade', 'info');
                await this.createRoute(start, end);
            }

            notify(msg, type) {
                const note = document.getElementById('notification');
                note.textContent = msg;
                note.style.borderColor = type === 'error' ? '#e31937' : type === 'success' ? '#4caf50' : '#3e6ae1';
                note.style.color = type === 'error' ? '#e31937' : type === 'success' ? '#4caf50' : '#3e6ae1';
                note.classList.remove('hidden');
                setTimeout(() => note.classList.add('hidden'), 3000);
            }
        }
        
        window.addEventListener('load', () => {
            window.nav = new TeslaNav();
        });
    </script>
