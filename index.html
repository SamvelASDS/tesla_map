<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tesla Navigator</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --tesla-black: #000000;
            --tesla-dark-gray: #1a1a1a;
            --tesla-gray: #2a2a2a;
            --tesla-light-gray: #3a3a3a;
            --tesla-blue: #3e6ae1;
            --tesla-white: #ffffff;
            --tesla-text: #e8e8e8;
            --tesla-text-dim: #a0a0a0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--tesla-black);
            color: var(--tesla-text);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        .header {
            background: linear-gradient(180deg, var(--tesla-dark-gray) 0%, var(--tesla-black) 100%);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--tesla-light-gray);
            z-index: 1000;
            position: relative;
        }
        .logo { font-size: 16px; font-weight: 600; letter-spacing: 1px; }
        .status { font-size: 11px; color: var(--tesla-text-dim); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .speed { font-size: 28px; font-weight: 700; color: var(--tesla-blue); margin-right: 12px; }
        .data-badge {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4caf50;
            color: #4caf50;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
        }
        #map { 
            width: 100%; 
            height: calc(100vh - 60px); 
            background: var(--tesla-dark-gray);
            cursor: pointer;
        }
        
        /* Map rotation container */
        .leaflet-container {
            transition: none !important;
        }
        
        /* Compass controls */
        .compass-controls {
            position: fixed;
            bottom: 140px;
            right: 16px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .compass-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(26, 26, 26, 0.95);
            border: 2px solid var(--tesla-light-gray);
            color: var(--tesla-text);
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s;
            position: relative;
        }
        
        .compass-btn:active {
            transform: scale(0.95);
        }
        
        .compass-btn.active {
            background: var(--tesla-blue);
            border-color: var(--tesla-blue);
            color: white;
            box-shadow: 0 0 20px rgba(62, 106, 225, 0.6);
        }
        
        .compass-btn .icon {
            transition: transform 0.1s ease;
        }
        
        .compass-direction {
            position: absolute;
            top: -20px;
            font-size: 10px;
            font-weight: 700;
            color: var(--tesla-blue);
        }
        
        .control-panel { 
            position: fixed; 
            left: 12px;
            top: 80px;
            z-index: 1000;
            transition: opacity 0.3s ease, transform 0.3s ease;
            max-width: 340px;
        }
        .control-panel.hidden-ui {
            opacity: 0;
            transform: translateX(-20px);
            pointer-events: none;
        }
        
        .search-container {
            background: rgba(26, 26, 26, 0.95); 
            padding: 10px;
            border-radius: 10px; 
            border: 1px solid var(--tesla-light-gray); 
            margin-bottom: 6px;
            backdrop-filter: blur(10px);
        }
        
        .search-mode {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
            padding: 4px;
            background: var(--tesla-gray);
            border-radius: 6px;
        }
        
        .mode-btn {
            flex: 1;
            padding: 6px;
            border: none;
            background: transparent;
            color: var(--tesla-text-dim);
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .mode-btn.active {
            background: var(--tesla-blue);
            color: white;
        }
        
        .input-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }
        .input-row:last-child {
            margin-bottom: 0;
        }
        
        .input-icon {
            font-size: 18px;
            min-width: 24px;
            text-align: center;
        }
        
        .search-input {
            flex: 1; 
            background: var(--tesla-gray); 
            border: 1px solid var(--tesla-light-gray);
            border-radius: 6px; 
            padding: 10px 12px; 
            color: var(--tesla-text); 
            font-size: 14px; 
            outline: none;
        }
        .search-input:focus { border-color: var(--tesla-blue); }
        .search-input::placeholder { color: var(--tesla-text-dim); font-size: 13px; }
        
        .traffic-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-top: 1px solid var(--tesla-light-gray);
            margin-top: 8px;
        }
        
        .traffic-label {
            font-size: 12px;
            color: var(--tesla-text-dim);
        }
        
        .traffic-buttons {
            display: flex;
            gap: 4px;
        }
        
        .traffic-btn {
            padding: 4px 10px;
            border: 1px solid var(--tesla-light-gray);
            background: var(--tesla-gray);
            color: var(--tesla-text-dim);
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .traffic-btn.active {
            background: #ff9800;
            color: white;
            border-color: #ff9800;
        }
        
        .btn-go {
            background: #4caf50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 6px;
        }
        .btn-go:active { transform: scale(0.95); }
        
        .button-group {
            display: flex; 
            gap: 6px; 
            background: rgba(26, 26, 26, 0.95); 
            padding: 10px;
            border-radius: 10px; 
            border: 1px solid var(--tesla-light-gray);
            backdrop-filter: blur(10px);
        }
        .btn-start { 
            background: #4caf50; 
            color: var(--tesla-white); 
            font-size: 16px; 
            padding: 14px; 
            width: 100%; 
            margin-bottom: 6px; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: 700;
        }
        .btn { 
            flex: 1; 
            padding: 10px 6px; 
            border: none; 
            border-radius: 6px; 
            font-size: 12px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.2s; 
        }
        .btn:active { transform: scale(0.95); }
        .btn-primary { background: var(--tesla-blue); color: var(--tesla-white); }
        .btn-secondary { background: var(--tesla-gray); color: var(--tesla-text); border: 1px solid var(--tesla-light-gray); }
        
        .turn-instruction {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 26, 26, 0.98);
            border: 2px solid var(--tesla-blue);
            border-radius: 16px;
            padding: 20px 24px;
            z-index: 2000;
            min-width: 300px;
            max-width: 90vw;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        
        .turn-instruction .icon {
            font-size: 48px;
            text-align: center;
            margin-bottom: 12px;
        }
        
        .turn-instruction .distance {
            font-size: 32px;
            font-weight: 700;
            color: var(--tesla-blue);
            text-align: center;
            margin-bottom: 8px;
        }
        
        .turn-instruction .text {
            font-size: 16px;
            color: var(--tesla-text);
            text-align: center;
            line-height: 1.4;
        }
        
        .turn-instruction .street {
            font-size: 14px;
            color: var(--tesla-text-dim);
            text-align: center;
            margin-top: 8px;
            font-style: italic;
        }
        
        .route-info {
            position: fixed; 
            bottom: 20px; 
            left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 26, 26, 0.95);
            border: 1px solid var(--tesla-light-gray); 
            border-radius: 16px; 
            padding: 16px 24px; 
            z-index: 1000; 
            backdrop-filter: blur(10px);
            display: flex;
            gap: 24px;
            align-items: center;
        }
        
        .route-stat-compact { 
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .route-stat-compact .label { font-size: 10px; color: var(--tesla-text-dim); text-transform: uppercase; }
        .route-stat-compact .value { font-size: 18px; font-weight: 700; color: var(--tesla-blue); }
        
        .stop-nav-btn {
            background: #e31937;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        
        .notification {
            position: fixed; 
            top: 70px; 
            left: 50%; 
            transform: translateX(-50%);
            background: rgba(26, 26, 26, 0.95); 
            border: 1px solid var(--tesla-blue);
            border-radius: 8px; 
            padding: 10px 16px; 
            z-index: 2000; 
            color: var(--tesla-blue);
            max-width: 85vw; 
            text-align: center; 
            font-size: 13px;
            backdrop-filter: blur(10px);
        }
        
        .hidden { display: none !important; }
        
        .leaflet-routing-container { display: none; }
        .leaflet-control-zoom a { background: var(--tesla-gray) !important; color: var(--tesla-text) !important; border: 1px solid var(--tesla-light-gray) !important; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">🚗 TESLA</div>
        <div class="data-badge">🧭 COMPASS NAV</div>
        <div style="display: flex; align-items: center;">
            <span id="speed" class="speed">0</span>
            <span id="location" class="status">Getting GPS...</span>
        </div>
    </div>
    <div id="map"></div>
    
    <!-- Compass controls -->
    <div class="compass-controls">
        <div class="compass-btn" id="compassBtn" title="Toggle heading mode">
            <div class="compass-direction" id="compassDirection">N</div>
            <div class="icon" id="compassIcon">🧭</div>
        </div>
        <div class="compass-btn" id="northBtn" title="Reset to North">
            <div class="icon">⬆️</div>
        </div>
    </div>
    
    <div id="turnInstruction" class="turn-instruction hidden">
        <div class="icon" id="turnIcon">↑</div>
        <div class="distance" id="turnDistance">500 m</div>
        <div class="text" id="turnText">Continue straight</div>
        <div class="street" id="turnStreet"></div>
    </div>
    
    <div id="navBar" class="route-info hidden">
        <div class="route-stat-compact">
            <span class="label">Distance</span>
            <span id="navDistance" class="value">--</span>
        </div>
        <div class="route-stat-compact">
            <span class="label">Time</span>
            <span id="navTime" class="value">--</span>
        </div>
        <div class="route-stat-compact">
            <span class="label">ETA</span>
            <span id="navETA" class="value">--</span>
        </div>
        <button id="stopNavBtn" class="stop-nav-btn">⏹️ STOP</button>
    </div>
    
    <div class="control-panel" id="controlPanel">
        <button id="startNavBtn" class="btn-start hidden">🚀 START NAVIGATION</button>
        
        <div class="search-container">
            <div class="search-mode">
                <button class="mode-btn" data-mode="osm">OpenStreetMap</button>
                <button class="mode-btn active" data-mode="yandex">Yandex 🇦🇲</button>
            </div>
            
            <div class="input-row">
                <span class="input-icon">🔵</span>
                <input type="text" id="fromInput" placeholder="From: Your location..." class="search-input">
            </div>
            <div class="input-row">
                <span class="input-icon">🔴</span>
                <input type="text" id="toInput" placeholder="To: Destination..." class="search-input">
            </div>
            
            <div class="traffic-toggle">
                <span class="traffic-label">🚦 Traffic:</span>
                <div class="traffic-buttons">
                    <button class="traffic-btn" data-multiplier="1">None</button>
                    <button class="traffic-btn active" data-multiplier="1.3">Light</button>
                    <button class="traffic-btn" data-multiplier="1.6">Heavy</button>
                </div>
            </div>
            
            <button id="goBtn" class="btn-go">🚀 GO</button>
        </div>
        
        <div class="button-group">
            <button id="locateBtn" class="btn btn-secondary">📍 GPS</button>
            <button id="clearBtn" class="btn btn-secondary">✖️ Clear</button>
        </div>
    </div>
    
    <div id="notification" class="notification hidden"></div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    <script>
        class TeslaNav {
            constructor() {
                this.map = null;
                this.userMarker = null;
                this.currentPos = null;
                this.startMarker = null;
                this.destMarker = null;
                this.routing = null;
                this.currentRoute = null;
                this.speed = 0;
                this.watchId = null;
                this.isNavigating = false;
                this.trafficMultiplier = 1.3;
                this.baseDuration = 0;
                this.searchMode = 'yandex';
                this.instructions = [];
                this.currentInstruction = 0;
                
                // Compass
                this.heading = 0;
                this.compassMode = false;
                this.orientationSupported = false;
                
                this.init();
            }
            
            init() {
                this.map = L.map('map', {
                    zoomControl: true,
                    attributionControl: false
                }).setView([40.1872, 44.5152], 12);
                
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap',
                    maxZoom: 19
                }).addTo(this.map);
                
                this.startGPS();
                this.initCompass();
                this.initControls();
                this.notify('Ready! 🚗', 'success');
            }
            
            initCompass() {
                if (window.DeviceOrientationEvent) {
                    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                        // iOS 13+ - will request on button press
                        this.notify('Tap 🧭 to enable compass', 'info');
                    } else {
                        // Android - auto-start
                        this.startCompass();
                    }
                }
            }
            
            async requestOrientationPermission() {
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    try {
                        const permission = await DeviceOrientationEvent.requestPermission();
                        if (permission === 'granted') {
                            this.startCompass();
                            return true;
                        }
                        return false;
                    } catch (error) {
                        this.notify('❌ Compass permission denied', 'error');
                        return false;
                    }
                } else {
                    this.startCompass();
                    return true;
                }
            }
            
            startCompass() {
                const handleOrientation = (event) => {
                    let heading = null;
                    
                    if (event.webkitCompassHeading !== undefined) {
                        // iOS
                        heading = event.webkitCompassHeading;
                    } else if (event.alpha !== null) {
                        // Android
                        heading = 360 - event.alpha;
                    }
                    
                    if (heading !== null) {
                        this.heading = heading;
                        this.updateCompassDisplay();
                        
                        if (this.compassMode && this.isNavigating) {
                            this.rotatePaneToHeading(heading);
                        }
                    }
                };
                
                window.addEventListener('deviceorientationabsolute', handleOrientation, true);
                window.addEventListener('deviceorientation', handleOrientation, true);
                
                this.orientationSupported = true;
                console.log('Compass started');
            }
            
            updateCompassDisplay() {
                const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
                const index = Math.round(this.heading / 45) % 8;
                document.getElementById('compassDirection').textContent = directions[index];
                
                const icon = document.getElementById('compassIcon');
                icon.style.transform = `rotate(${this.heading}deg)`;
            }
            
            rotatePaneToHeading(heading) {
                const mapPane = this.map.getPanes().mapPane;
                if (mapPane) {
                    mapPane.style.transform = `rotateZ(${-heading}deg)`;
                }
                
                // Keep markers upright
                document.querySelectorAll('.leaflet-marker-icon').forEach(marker => {
                    marker.style.transform = `rotateZ(${heading}deg)`;
                });
            }
            
            async toggleCompassMode() {
                if (!this.compassMode) {
                    // Turning ON compass mode
                    if (!this.orientationSupported) {
                        const granted = await this.requestOrientationPermission();
                        if (!granted) return;
                    }
                    
                    this.compassMode = true;
                    document.getElementById('compassBtn').classList.add('active');
                    this.notify('🧭 Heading mode ON', 'success');
                } else {
                    // Turning OFF compass mode
                    this.compassMode = false;
                    document.getElementById('compassBtn').classList.remove('active');
                    this.resetToNorth();
                    this.notify('📍 North mode ON', 'info');
                }
            }
            
            resetToNorth() {
                const mapPane = this.map.getPanes().mapPane;
                if (mapPane) {
                    mapPane.style.transition = 'transform 0.3s ease';
                    mapPane.style.transform = 'rotateZ(0deg)';
                    
                    setTimeout(() => {
                        mapPane.style.transition = '';
                    }, 300);
                }
                
                // Reset markers
                document.querySelectorAll('.leaflet-marker-icon').forEach(marker => {
                    marker.style.transform = '';
                });
                
                this.notify('⬆️ Reset to North', 'info');
            }
            
            startGPS() {
                if (!navigator.geolocation) {
                    this.notify('❌ GPS not available', 'error');
                    return;
                }
                
                const options = {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                };
                
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        console.log('Initial GPS:', pos.coords.latitude, pos.coords.longitude);
                        this.updatePosition(pos);
                        this.notify('✅ GPS connected!', 'success');
                    },
                    (err) => {
                        console.error('GPS Error:', err);
                        this.notify('⚠️ GPS error', 'error');
                    },
                    options
                );
                
                this.watchId = navigator.geolocation.watchPosition(
                    (pos) => {
                        console.log('GPS Update:', pos.coords.latitude.toFixed(6), pos.coords.longitude.toFixed(6), 'Nav:', this.isNavigating);
                        this.updatePosition(pos);
                    },
                    (err) => console.error('Watch error:', err),
                    options
                );
            }
            
            updatePosition(pos) {
                const { latitude, longitude, speed } = pos.coords;
                
                this.currentPos = [latitude, longitude];
                
                // Update speed
                if (speed !== null && speed >= 0) {
                    const kmh = Math.round(speed * 3.6);
                    this.speed = kmh;
                    document.getElementById('speed').textContent = kmh;
                }
                
                // Create or update marker
                if (!this.userMarker) {
                    this.userMarker = L.marker(this.currentPos, {
                        icon: L.divIcon({
                            html: '<div style="width:26px;height:26px;background:#3e6ae1;border:4px solid white;border-radius:50%;box-shadow:0 0 25px rgba(62,106,225,1);"></div>',
                            iconSize: [26, 26],
                            className: 'user-position-marker'
                        }),
                        zIndexOffset: 1000
                    }).addTo(this.map);
                    
                    this.map.setView(this.currentPos, 14);
                    this.updateLocationName(latitude, longitude);
                    document.getElementById('fromInput').placeholder = 'From: GPS ✅';
                } else {
                    this.userMarker.setLatLng(this.currentPos);
                }
                
                // CRITICAL: Auto-follow and zoom during navigation
                if (this.isNavigating) {
                    console.log('Navigation active - moving map to:', this.currentPos);
                    this.map.setView(this.currentPos, 18, {
                        animate: false // No animation for smoother tracking
                    });
                    
                    this.updateNavigationInfo();
                }
            }
            
            updateNavigationInfo() {
                if (!this.currentRoute || !this.destMarker) return;
                
                const destCoords = this.destMarker.getLatLng();
                const distance = this.calculateDistance(this.currentPos, [destCoords.lat, destCoords.lng]);
                
                document.getElementById('navDistance').textContent = distance.toFixed(1) + ' km';
                this.updateTurnInstruction(distance);
                
                if (distance < 0.05) {
                    this.notify('🎯 You have arrived!', 'success');
                    setTimeout(() => {
                        this.stopNavigation();
                        this.clear();
                    }, 3000);
                }
            }
            
            updateTurnInstruction(remainingDist) {
                if (!this.instructions || this.instructions.length === 0) {
                    document.getElementById('turnText').textContent = 'Continue on route';
                    document.getElementById('turnDistance').textContent = remainingDist < 1 ? 
                        Math.round(remainingDist * 1000) + ' m' : remainingDist.toFixed(1) + ' km';
                    return;
                }
                
                const nextInstruction = this.instructions[this.currentInstruction];
                if (!nextInstruction) return;
                
                const distToTurn = remainingDist;
                
                document.getElementById('turnDistance').textContent = 
                    distToTurn < 1 ? Math.round(distToTurn * 1000) + ' m' : distToTurn.toFixed(1) + ' km';
                
                document.getElementById('turnText').textContent = nextInstruction.text || 'Continue';
                document.getElementById('turnStreet').textContent = nextInstruction.street || '';
                
                const type = nextInstruction.type || 'Straight';
                document.getElementById('turnIcon').textContent = this.getTurnIcon(type);
            }
            
            getTurnIcon(type) {
                const icons = {
                    'Left': '↰',
                    'Right': '↱',
                    'SlightLeft': '↖',
                    'SlightRight': '↗',
                    'SharpLeft': '⬅',
                    'SharpRight': '➡',
                    'Straight': '↑',
                    'Uturn': '⤶'
                };
                return icons[type] || '↑';
            }
            
            calculateDistance(pos1, pos2) {
                const R = 6371;
                const lat1 = pos1[0] * Math.PI / 180;
                const lat2 = pos2[0] * Math.PI / 180;
                const dLat = (pos2[0] - pos1[0]) * Math.PI / 180;
                const dLon = (pos2[1] - pos1[1]) * Math.PI / 180;
                
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                         Math.cos(lat1) * Math.cos(lat2) *
                         Math.sin(dLon/2) * Math.sin(dLon/2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                return R * c;
            }
            
            async updateLocationName(lat, lon) {
                try {
                    const url = `https://geocode-maps.yandex.ru/1.x/?apikey=&geocode=${lon},${lat}&format=json&lang=en_US`;
                    const res = await fetch(url);
                    const data = await res.json();
                    const geoObj = data?.response?.GeoObjectCollection?.featureMember?.[0]?.GeoObject;
                    const name = geoObj?.metaDataProperty?.GeocoderMetaData?.text || `${lat.toFixed(3)}, ${lon.toFixed(3)}`;
                    document.getElementById('location').textContent = name.length > 30 ? name.substring(0, 30) + '...' : name;
                } catch {
                    document.getElementById('location').textContent = `${lat.toFixed(3)}, ${lon.toFixed(3)}`;
                }
            }
            
            initControls() {
                document.getElementById('compassBtn').onclick = () => this.toggleCompassMode();
                document.getElementById('northBtn').onclick = () => {
                    this.compassMode = false;
                    document.getElementById('compassBtn').classList.remove('active');
                    this.resetToNorth();
                };
                
                document.querySelectorAll('.mode-btn').forEach(btn => {
                    btn.onclick = () => {
                        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.searchMode = btn.dataset.mode;
                    };
                });
                
                document.querySelectorAll('.traffic-btn').forEach(btn => {
                    btn.onclick = () => {
                        document.querySelectorAll('.traffic-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.trafficMultiplier = parseFloat(btn.dataset.multiplier);
                        if (this.baseDuration > 0) this.updateDurationDisplay();
                    };
                });
                
                document.getElementById('goBtn').onclick = () => this.calculateRoute();
                
                [document.getElementById('fromInput'), document.getElementById('toInput')].forEach(input => {
                    input.onkeypress = (e) => { if (e.key === 'Enter') this.calculateRoute(); };
                });
                
                document.getElementById('locateBtn').onclick = () => this.center();
                document.getElementById('clearBtn').onclick = () => this.clear();
                document.getElementById('startNavBtn').onclick = () => this.startNavigation();
                document.getElementById('stopNavBtn').onclick = () => this.stopNavigation();
            }
            
            async calculateRoute() {
                const fromValue = document.getElementById('fromInput').value.trim();
                const toValue = document.getElementById('toInput').value.trim();
                
                let startCoords = fromValue ? await this.geocodeAddress(fromValue) : this.currentPos;
                
                if (!startCoords) {
                    this.notify('⚠️ Enter start or enable GPS', 'error');
                    return;
                }
                
                if (!toValue) {
                    this.notify('⚠️ Enter destination', 'error');
                    return;
                }
                
                this.notify('🔍 Finding destination...', 'info');
                const destCoords = await this.geocodeAddress(toValue);
                if (!destCoords) {
                    this.notify('❌ Destination not found', 'error');
                    return;
                }
                
                this.createRoute(startCoords, destCoords);
            }
            
            async geocodeAddress(address) {
                try {
                    await new Promise(resolve => setTimeout(resolve, 300));
                    
                    if (this.searchMode === 'yandex') {
                        const url = `https://geocode-maps.yandex.ru/1.x/?apikey=&geocode=${encodeURIComponent(address)}&format=json&lang=en_US`;
                        const res = await fetch(url);
                        if (!res.ok) return this.geocodeWithOSM(address);
                        const data = await res.json();
                        const geoObj = data?.response?.GeoObjectCollection?.featureMember?.[0]?.GeoObject;
                        if (!geoObj) return this.geocodeWithOSM(address);
                        const coords = geoObj.Point.pos.split(' ');
                        return [parseFloat(coords[1]), parseFloat(coords[0])];
                    } else {
                        return this.geocodeWithOSM(address);
                    }
                } catch {
                    return this.geocodeWithOSM(address);
                }
            }
            
            async geocodeWithOSM(address) {
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&limit=1&countrycodes=am`, {
                        headers: { 'User-Agent': 'TeslaNavigator/1.0' }
                    });
                    if (!res.ok) return null;
                    const results = await res.json();
                    return results.length > 0 ? [parseFloat(results[0].lat), parseFloat(results[0].lon)] : null;
                } catch {
                    return null;
                }
            }
            
            createRoute(start, end) {
                if (this.startMarker) this.map.removeLayer(this.startMarker);
                if (this.destMarker) this.map.removeLayer(this.destMarker);
                if (this.routing) this.map.removeControl(this.routing);
                
                this.notify('📍 Calculating route...', 'info');
                
                this.destMarker = L.marker(end, {
                    icon: L.divIcon({
                        html: '<div style="width:20px;height:20px;background:#e31937;border:3px solid white;border-radius:50%;box-shadow:0 0 10px rgba(227,25,55,0.8);"></div>',
                        iconSize: [20, 20],
                        className: ''
                    })
                }).addTo(this.map);
                
                this.routing = L.Routing.control({
                    waypoints: [L.latLng(start), L.latLng(end)],
                    routeWhileDragging: false,
                    showAlternatives: false,
                    lineOptions: { styles: [{ color: '#3e6ae1', weight: 7 }] },
                    createMarker: () => null,
                    router: L.Routing.osrmv1({
                        serviceUrl: 'https://router.project-osrm.org/route/v1'
                    })
                }).addTo(this.map);
                
                this.routing.on('routesfound', (e) => {
                    const route = e.routes[0];
                    this.currentRoute = route;
                    this.instructions = route.instructions || [];
                    this.currentInstruction = 0;
                    
                    const dist = (route.summary.totalDistance / 1000).toFixed(1);
                    this.baseDuration = Math.round(route.summary.totalTime / 60);
                    
                    this.updateDurationDisplay();
                    document.getElementById('startNavBtn').classList.remove('hidden');
                    
                    this.notify('✅ Route ready! Tap START', 'success');
                });
            }
            
            updateDurationDisplay() {
                const adjustedDuration = Math.round(this.baseDuration * this.trafficMultiplier);
                const eta = new Date(Date.now() + adjustedDuration * 60000).toLocaleTimeString('en-US', {
                    hour: 'numeric',
                    minute: '2-digit',
                    hour12: true
                });
                
                document.getElementById('navTime').textContent = adjustedDuration + ' min';
                document.getElementById('navETA').textContent = eta;
            }
            
            startNavigation() {
                if (!this.routing || !this.currentRoute) {
                    this.notify('Calculate route first', 'error');
                    return;
                }
                
                console.log('=== STARTING NAVIGATION ===');
                console.log('Current position:', this.currentPos);
                
                this.isNavigating = true;
                
                document.getElementById('navBar').classList.remove('hidden');
                document.getElementById('turnInstruction').classList.remove('hidden');
                document.getElementById('controlPanel').classList.add('hidden-ui');
                
                if (this.currentPos) {
                    console.log('Setting view to zoom 18');
                    this.map.setView(this.currentPos, 18);
                }
                
                this.updateNavigationInfo();
                this.notify('🧭 Navigation started! Following your position...', 'success');
            }
            
            stopNavigation() {
                console.log('=== STOPPING NAVIGATION ===');
                
                this.isNavigating = false;
                
                document.getElementById('navBar').classList.add('hidden');
                document.getElementById('turnInstruction').classList.add('hidden');
                document.getElementById('controlPanel').classList.remove('hidden-ui');
                
                this.compassMode = false;
                document.getElementById('compassBtn').classList.remove('active');
                this.resetToNorth();
                
                this.notify('Navigation stopped', 'info');
            }
            
            center() {
                if (this.currentPos) {
                    this.map.setView(this.currentPos, this.isNavigating ? 18 : 16);
                    this.notify('📍 Centered', 'success');
                } else {
                    this.notify('⚠️ No GPS', 'error');
                }
            }
            
            clear() {
                this.stopNavigation();
                
                if (this.routing) this.map.removeControl(this.routing);
                if (this.startMarker) this.map.removeLayer(this.startMarker);
                if (this.destMarker) this.map.removeLayer(this.destMarker);
                
                this.routing = null;
                this.currentRoute = null;
                this.startMarker = null;
                this.destMarker = null;
                this.instructions = [];
                this.baseDuration = 0;
                
                document.getElementById('startNavBtn').classList.add('hidden');
                document.getElementById('fromInput').value = '';
                document.getElementById('toInput').value = '';
                
                this.notify('✖️ Cleared', 'info');
            }
            
            notify(msg, type) {
                const note = document.getElementById('notification');
                note.textContent = msg;
                note.style.borderColor = type === 'error' ? '#e31937' : type === 'success' ? '#4caf50' : '#3e6ae1';
                note.style.color = type === 'error' ? '#e31937' : type === 'success' ? '#4caf50' : '#3e6ae1';
                note.classList.remove('hidden');
                setTimeout(() => note.classList.add('hidden'), 3000);
            }
        }
        
        window.addEventListener('load', () => {
            window.nav = new TeslaNav();
        });
    </script>
</body>
</html>
