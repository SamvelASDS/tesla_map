<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tesla Navigator</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --tesla-black: #000000;
            --tesla-dark-gray: #1a1a1a;
            --tesla-gray: #2a2a2a;
            --tesla-light-gray: #3a3a3a;
            --tesla-blue: #3e6ae1;
            --tesla-white: #ffffff;
            --tesla-text: #e8e8e8;
            --tesla-text-dim: #a0a0a0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--tesla-black);
            color: var(--tesla-text);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        .header {
            background: linear-gradient(180deg, var(--tesla-dark-gray) 0%, var(--tesla-black) 100%);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--tesla-light-gray);
            z-index: 1000;
            position: relative;
        }
        .logo { font-size: 16px; font-weight: 600; letter-spacing: 1px; }
        .status { font-size: 11px; color: var(--tesla-text-dim); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .speed { font-size: 28px; font-weight: 700; color: var(--tesla-blue); margin-right: 12px; }
        .data-badge {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4caf50;
            color: #4caf50;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
        }
        #map { 
            width: 100%; 
            height: calc(100vh - 60px); 
            background: var(--tesla-dark-gray);
            cursor: pointer;
        }
        
        .control-panel { 
            position: fixed; 
            left: 12px;
            top: 80px;
            z-index: 1000;
            transition: opacity 0.3s ease, transform 0.3s ease;
            max-width: 340px;
        }
        .control-panel.hidden-ui {
            opacity: 0;
            transform: translateX(-20px);
            pointer-events: none;
        }
        
        .search-container {
            background: rgba(26, 26, 26, 0.95); 
            padding: 10px;
            border-radius: 10px; 
            border: 1px solid var(--tesla-light-gray); 
            margin-bottom: 6px;
            backdrop-filter: blur(10px);
        }
        
        .input-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }
        .input-row:last-child {
            margin-bottom: 0;
        }
        
        .input-icon {
            font-size: 18px;
            min-width: 24px;
            text-align: center;
        }
        
        .search-input {
            flex: 1; 
            background: var(--tesla-gray); 
            border: 1px solid var(--tesla-light-gray);
            border-radius: 6px; 
            padding: 10px 12px; 
            color: var(--tesla-text); 
            font-size: 14px; 
            outline: none;
        }
        .search-input:focus { border-color: var(--tesla-blue); }
        .search-input::placeholder { color: var(--tesla-text-dim); font-size: 13px; }
        
        .traffic-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-top: 1px solid var(--tesla-light-gray);
            margin-top: 8px;
        }
        
        .traffic-label {
            font-size: 12px;
            color: var(--tesla-text-dim);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .traffic-buttons {
            display: flex;
            gap: 4px;
        }
        
        .traffic-btn {
            padding: 4px 10px;
            border: 1px solid var(--tesla-light-gray);
            background: var(--tesla-gray);
            color: var(--tesla-text-dim);
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .traffic-btn.active {
            background: #ff9800;
            color: white;
            border-color: #ff9800;
        }
        
        .btn-go {
            background: #4caf50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 6px;
        }
        .btn-go:active { transform: scale(0.95); }
        
        .button-group {
            display: flex; 
            gap: 6px; 
            background: rgba(26, 26, 26, 0.95); 
            padding: 10px;
            border-radius: 10px; 
            border: 1px solid var(--tesla-light-gray);
            backdrop-filter: blur(10px);
        }
        .btn-start { 
            background: #4caf50; 
            color: var(--tesla-white); 
            font-size: 16px; 
            padding: 14px; 
            width: 100%; 
            margin-bottom: 6px; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: 700;
        }
        .btn { 
            flex: 1; 
            padding: 10px 6px; 
            border: none; 
            border-radius: 6px; 
            font-size: 12px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.2s; 
        }
        .btn:active { transform: scale(0.95); }
        .btn-primary { background: var(--tesla-blue); color: var(--tesla-white); }
        .btn-secondary { background: var(--tesla-gray); color: var(--tesla-text); border: 1px solid var(--tesla-light-gray); }
        
        .route-info {
            position: fixed; 
            top: 80px; 
            right: 12px; 
            background: rgba(26, 26, 26, 0.95);
            border: 1px solid var(--tesla-light-gray); 
            border-radius: 10px; 
            padding: 12px; 
            z-index: 1000; 
            min-width: 160px;
            backdrop-filter: blur(10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .route-info.hidden-ui {
            opacity: 0;
            transform: translateX(20px);
            pointer-events: none;
        }
        
        .route-stat { display: flex; justify-content: space-between; margin-bottom: 6px; align-items: baseline; }
        .route-stat .label { font-size: 11px; color: var(--tesla-text-dim); }
        .route-stat .value { font-size: 15px; font-weight: 700; color: var(--tesla-blue); }
        .route-stat .value-small { font-size: 11px; color: var(--tesla-text-dim); text-decoration: line-through; margin-left: 6px; }
        
        .notification {
            position: fixed; 
            top: 70px; 
            left: 50%; 
            transform: translateX(-50%);
            background: rgba(26, 26, 26, 0.95); 
            border: 1px solid var(--tesla-blue);
            border-radius: 8px; 
            padding: 10px 16px; 
            z-index: 2000; 
            color: var(--tesla-blue);
            max-width: 85vw; 
            text-align: center; 
            font-size: 13px;
            backdrop-filter: blur(10px);
        }
        
        .hidden { display: none !important; }
        
        .driving-mode {
            position: fixed;
            bottom: 20px;
            right: 12px;
            background: rgba(33, 150, 243, 0.95);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }
        
        .ui-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 26, 26, 0.8);
            color: var(--tesla-text-dim);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 11px;
            z-index: 999;
            backdrop-filter: blur(10px);
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .ui-hint.hidden-ui {
            opacity: 0;
        }
        
        .leaflet-routing-container { display: none; }
        .leaflet-control-zoom a { background: var(--tesla-gray) !important; color: var(--tesla-text) !important; border: 1px solid var(--tesla-light-gray) !important; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">🚗 TESLA</div>
        <div class="data-badge">🚦 TRAFFIC MODE</div>
        <div style="display: flex; align-items: center;">
            <span id="speed" class="speed">0</span>
            <span id="location" class="status">GPS...</span>
        </div>
    </div>
    <div id="map"></div>
    <div id="drivingMode" class="driving-mode hidden">🧭 DRIVING</div>
    <div id="uiHint" class="ui-hint">Touch map to show controls</div>
    
    <div class="control-panel" id="controlPanel">
        <button id="startNavBtn" class="btn-start hidden">🚀 START</button>
        
        <div class="search-container">
            <div class="input-row">
                <span class="input-icon">🔵</span>
                <input type="text" id="fromInput" placeholder="From: Your location..." class="search-input">
            </div>
            <div class="input-row">
                <span class="input-icon">🔴</span>
                <input type="text" id="toInput" placeholder="To: Destination..." class="search-input">
            </div>
            
            <div class="traffic-toggle">
                <span class="traffic-label">🚦 Traffic:</span>
                <div class="traffic-buttons">
                    <button class="traffic-btn" data-multiplier="1">None</button>
                    <button class="traffic-btn active" data-multiplier="1.3">Light</button>
                    <button class="traffic-btn" data-multiplier="1.6">Heavy</button>
                </div>
            </div>
            
            <button id="goBtn" class="btn-go">🚀 GO</button>
        </div>
        
        <div class="button-group">
            <button id="locateBtn" class="btn btn-secondary">📍 GPS</button>
            <button id="clearBtn" class="btn btn-secondary">✖️ Clear</button>
            <button id="followBtn" class="btn btn-secondary">🎯 Follow</button>
        </div>
    </div>
    
    <div id="routeInfo" class="route-info hidden">
        <div class="route-stat"><span class="label">Distance</span><span id="routeDistance" class="value">--</span></div>
        <div class="route-stat">
            <span class="label">Time</span>
            <span>
                <span id="routeDuration" class="value">--</span>
                <span id="routeDurationIdeal" class="value-small"></span>
            </span>
        </div>
        <div class="route-stat"><span class="label">ETA</span><span id="routeETA" class="value">--</span></div>
        <div class="route-stat"><span class="label">Remaining</span><span id="routeRemaining" class="value">--</span></div>
    </div>
    <div id="notification" class="notification hidden"></div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    <script>
        class TeslaNav {
            constructor() {
                this.map = null;
                this.userMarker = null;
                this.currentPos = null;
                this.startMarker = null;
                this.destMarker = null;
                this.routing = null;
                this.currentRoute = null;
                this.speed = 0;
                this.watchId = null;
                this.followMode = false;
                this.isDriving = false;
                this.uiVisible = true;
                this.uiTimeout = null;
                this.trafficMultiplier = 1.3; // Default: Light traffic
                this.baseDuration = 0;
                this.init();
            }
            
            init() {
                this.map = L.map('map').setView([40.1872, 44.5152], 12);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap',
                    maxZoom: 19
                }).addTo(this.map);
                
                this.startGPS();
                this.initControls();
                this.initUIAutoHide();
                this.notify('Enter addresses 📍', 'success');
            }
            
            initUIAutoHide() {
                const showUI = () => this.showUI();
                
                this.map.on('zoomstart', showUI);
                this.map.on('movestart', showUI);
                this.map.on('click', showUI);
                
                const controlPanel = document.getElementById('controlPanel');
                const routeInfo = document.getElementById('routeInfo');
                
                [controlPanel, routeInfo].forEach(el => {
                    el.addEventListener('mouseenter', () => this.cancelHideUI());
                    el.addEventListener('mouseleave', () => this.scheduleHideUI());
                    el.addEventListener('touchstart', () => {
                        this.showUI();
                        this.cancelHideUI();
                    });
                });
                
                this.scheduleHideUI(6000);
            }
            
            showUI() {
                this.uiVisible = true;
                document.getElementById('controlPanel').classList.remove('hidden-ui');
                document.getElementById('routeInfo').classList.remove('hidden-ui');
                document.getElementById('uiHint').classList.add('hidden-ui');
                this.cancelHideUI();
                this.scheduleHideUI();
            }
            
            hideUI() {
                const fromInput = document.getElementById('fromInput');
                const toInput = document.getElementById('toInput');
                if (document.activeElement === fromInput || document.activeElement === toInput) {
                    this.scheduleHideUI();
                    return;
                }
                
                this.uiVisible = false;
                document.getElementById('controlPanel').classList.add('hidden-ui');
                document.getElementById('routeInfo').classList.add('hidden-ui');
                document.getElementById('uiHint').classList.remove('hidden-ui');
            }
            
            scheduleHideUI(delay = 5000) {
                this.cancelHideUI();
                this.uiTimeout = setTimeout(() => this.hideUI(), delay);
            }
            
            cancelHideUI() {
                if (this.uiTimeout) {
                    clearTimeout(this.uiTimeout);
                    this.uiTimeout = null;
                }
            }
            
            startGPS() {
                if (!navigator.geolocation) {
                    this.notify('⚠️ GPS not available', 'error');
                    document.getElementById('location').textContent = 'No GPS';
                    return;
                }
                
                const options = {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 3000
                };
                
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        this.updatePosition(pos);
                        this.notify('✅ GPS active!', 'success');
                    },
                    (err) => {
                        let msg = 'GPS unavailable';
                        if (err.code === 1) msg = 'GPS denied';
                        this.notify('⚠️ ' + msg, 'error');
                        document.getElementById('location').textContent = msg;
                    },
                    options
                );
                
                this.watchId = navigator.geolocation.watchPosition(
                    (pos) => this.updatePosition(pos),
                    null,
                    options
                );
            }
            
            updatePosition(pos) {
                const { latitude, longitude, speed } = pos.coords;
                this.currentPos = [latitude, longitude];
                
                if (speed !== null && speed >= 0) {
                    const kmh = Math.round(speed * 3.6);
                    this.speed = kmh;
                    document.getElementById('speed').textContent = kmh;
                    
                    this.isDriving = kmh > 5;
                    if (this.isDriving && this.routing) {
                        document.getElementById('drivingMode').classList.remove('hidden');
                    } else {
                        document.getElementById('drivingMode').classList.add('hidden');
                    }
                }
                
                if (!this.userMarker) {
                    this.userMarker = L.marker(this.currentPos, {
                        icon: L.divIcon({
                            html: '<div style="width:20px;height:20px;background:#3e6ae1;border:3px solid white;border-radius:50%;box-shadow:0 0 10px rgba(62,106,225,0.8);"></div>',
                            iconSize: [20, 20],
                            className: ''
                        })
                    }).addTo(this.map);
                    this.map.setView(this.currentPos, 14);
                    this.updateLocationName(latitude, longitude);
                    document.getElementById('fromInput').placeholder = 'From: GPS ✅';
                } else {
                    this.userMarker.setLatLng(this.currentPos);
                    
                    if (this.followMode || this.isDriving) {
                        this.map.setView(this.currentPos);
                    }
                    
                    if (this.routing && this.isDriving) {
                        this.updateRemainingDistance();
                    }
                }
            }
            
            async updateLocationName(lat, lon) {
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=14`, {
                        headers: { 'User-Agent': 'TeslaNavigator/1.0' }
                    });
                    const data = await res.json();
                    const name = data.display_name || `${lat.toFixed(3)}, ${lon.toFixed(3)}`;
                    document.getElementById('location').textContent = name.length > 30 ? name.substring(0, 30) + '...' : name;
                } catch {
                    document.getElementById('location').textContent = `${lat.toFixed(3)}, ${lon.toFixed(3)}`;
                }
            }
            
            updateRemainingDistance() {
                if (!this.routing || !this.currentPos || !this.destMarker) return;
                
                const destCoords = this.destMarker.getLatLng();
                const R = 6371;
                const lat1 = this.currentPos[0] * Math.PI / 180;
                const lat2 = destCoords.lat * Math.PI / 180;
                const dLat = (destCoords.lat - this.currentPos[0]) * Math.PI / 180;
                const dLon = (destCoords.lng - this.currentPos[1]) * Math.PI / 180;
                
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                         Math.cos(lat1) * Math.cos(lat2) *
                         Math.sin(dLon/2) * Math.sin(dLon/2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                const distance = R * c;
                
                document.getElementById('routeRemaining').textContent = distance.toFixed(1) + ' km';
                
                if (distance < 0.1) {
                    this.notify('🎯 Arrived!', 'success');
                    setTimeout(() => this.clear(), 4000);
                }
            }
            
            initControls() {
                // Traffic buttons
                document.querySelectorAll('.traffic-btn').forEach(btn => {
                    btn.onclick = () => {
                        document.querySelectorAll('.traffic-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.trafficMultiplier = parseFloat(btn.dataset.multiplier);
                        
                        // Recalculate if route exists
                        if (this.baseDuration > 0) {
                            this.updateDurationDisplay();
                        }
                        
                        this.showUI();
                    };
                });
                
                document.getElementById('goBtn').onclick = () => {
                    this.calculateRoute();
                    this.showUI();
                };
                
                [document.getElementById('fromInput'), document.getElementById('toInput')].forEach(input => {
                    input.onkeypress = (e) => {
                        if (e.key === 'Enter') {
                            this.calculateRoute();
                            this.showUI();
                        }
                    };
                    input.onfocus = () => {
                        this.showUI();
                        this.cancelHideUI();
                    };
                    input.onblur = () => this.scheduleHideUI();
                });
                
                document.getElementById('locateBtn').onclick = () => {
                    this.center();
                    this.showUI();
                };
                document.getElementById('clearBtn').onclick = () => {
                    this.clear();
                    this.showUI();
                };
                document.getElementById('startNavBtn').onclick = () => {
                    this.startNavigation();
                    this.showUI();
                };
                document.getElementById('followBtn').onclick = () => {
                    this.toggleFollow();
                    this.showUI();
                };
            }
            
            async calculateRoute() {
                const fromValue = document.getElementById('fromInput').value.trim();
                const toValue = document.getElementById('toInput').value.trim();
                
                let startCoords = null;
                
                if (fromValue) {
                    this.notify('🔍 Finding start...', 'info');
                    startCoords = await this.geocodeAddress(fromValue);
                    if (!startCoords) {
                        this.notify('❌ Start not found', 'error');
                        return;
                    }
                } else if (this.currentPos) {
                    startCoords = this.currentPos;
                } else {
                    this.notify('⚠️ Enter start or enable GPS', 'error');
                    return;
                }
                
                if (!toValue) {
                    this.notify('⚠️ Enter destination', 'error');
                    return;
                }
                
                this.notify('🔍 Finding destination...', 'info');
                const destCoords = await this.geocodeAddress(toValue);
                if (!destCoords) {
                    this.notify('❌ Destination not found', 'error');
                    return;
                }
                
                this.createRoute(startCoords, destCoords);
            }
            
            async geocodeAddress(address) {
                try {
                    await new Promise(resolve => setTimeout(resolve, 300));
                    
                    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&limit=1&countrycodes=am`, {
                        headers: { 'User-Agent': 'TeslaNavigator/1.0' }
                    });
                    
                    if (!res.ok) return null;
                    
                    const results = await res.json();
                    if (results.length === 0) return null;
                    
                    return [parseFloat(results[0].lat), parseFloat(results[0].lon)];
                } catch (error) {
                    console.error('Geocode error:', error);
                    return null;
                }
            }
            
            toggleFollow() {
                this.followMode = !this.followMode;
                const btn = document.getElementById('followBtn');
                if (this.followMode) {
                    btn.style.background = '#4caf50';
                    btn.style.color = 'white';
                    this.notify('Auto-follow ON', 'success');
                    if (this.currentPos) {
                        this.map.setView(this.currentPos, 16);
                    }
                } else {
                    btn.style.background = '';
                    btn.style.color = '';
                    this.notify('Auto-follow OFF', 'info');
                }
            }
            
            createRoute(start, end) {
                if (this.startMarker) this.map.removeLayer(this.startMarker);
                if (this.destMarker) this.map.removeLayer(this.destMarker);
                if (this.routing) this.map.removeControl(this.routing);
                
                this.notify('📍 Calculating...', 'info');
                
                this.startMarker = L.marker(start, {
                    icon: L.divIcon({
                        html: '<div style="width:16px;height:16px;background:#3e6ae1;border:2px solid white;border-radius:50%;"></div>',
                        iconSize: [16, 16],
                        className: ''
                    })
                }).addTo(this.map);
                
                this.destMarker = L.marker(end, {
                    icon: L.divIcon({
                        html: '<div style="width:16px;height:16px;background:#e31937;border:2px solid white;border-radius:50%;"></div>',
                        iconSize: [16, 16],
                        className: ''
                    })
                }).addTo(this.map);
                
                this.routing = L.Routing.control({
                    waypoints: [L.latLng(start), L.latLng(end)],
                    routeWhileDragging: false,
                    showAlternatives: false,
                    lineOptions: { styles: [{ color: '#3e6ae1', weight: 6 }] },
                    createMarker: () => null,
                    router: L.Routing.osrmv1({
                        serviceUrl: 'https://router.project-osrm.org/route/v1'
                    })
                }).addTo(this.map);
                
                this.routing.on('routesfound', (e) => {
                    const route = e.routes[0];
                    this.currentRoute = route;
                    
                    const dist = (route.summary.totalDistance / 1000).toFixed(1);
                    this.baseDuration = Math.round(route.summary.totalTime / 60);
                    
                    document.getElementById('routeDistance').textContent = dist + ' km';
                    this.updateDurationDisplay();
                    document.getElementById('routeRemaining').textContent = dist + ' km';
                    document.getElementById('routeInfo').classList.remove('hidden');
                    document.getElementById('startNavBtn').classList.remove('hidden');
                    
                    this.notify('✅ Route ready!', 'success');
                });
                
                this.routing.on('routingerror', (e) => {
                    console.error('Route error:', e);
                    this.notify('❌ Route failed', 'error');
                });
            }
            
            updateDurationDisplay() {
                const adjustedDuration = Math.round(this.baseDuration * this.trafficMultiplier);
                const eta = new Date(Date.now() + adjustedDuration * 60000).toLocaleTimeString('en-US', {
                    hour: 'numeric',
                    minute: '2-digit',
                    hour12: true
                });
                
                document.getElementById('routeDuration').textContent = adjustedDuration + ' min';
                
                // Show original time if traffic is applied
                if (this.trafficMultiplier > 1) {
                    document.getElementById('routeDurationIdeal').textContent = this.baseDuration + ' min';
                } else {
                    document.getElementById('routeDurationIdeal').textContent = '';
                }
                
                document.getElementById('routeETA').textContent = eta;
            }
            
            startNavigation() {
                if (!this.routing || !this.currentRoute) {
                    this.notify('Calculate route first', 'error');
                    return;
                }
                
                const coords = this.currentRoute.coordinates;
                if (coords && coords.length > 0) {
                    const bounds = L.latLngBounds(coords.map(c => [c.lat, c.lng]));
                    this.map.fitBounds(bounds, { padding: [60, 60], maxZoom: 15, animate: true });
                }
                
                this.followMode = true;
                document.getElementById('followBtn').style.background = '#4caf50';
                document.getElementById('followBtn').style.color = 'white';
                
                document.getElementById('startNavBtn').textContent = '🧭 NAVIGATING';
                document.getElementById('startNavBtn').style.background = '#2196f3';
                
                this.notify('🚀 Navigation started!', 'success');
                
                setTimeout(() => {
                    if (this.currentPos) {
                        this.map.setView(this.currentPos, 15);
                    }
                }, 2000);
            }
            
            center() {
                if (this.currentPos) {
                    this.map.setView(this.currentPos, 16);
                    this.notify('📍 Centered', 'success');
                } else {
                    this.notify('⚠️ No GPS', 'error');
                }
            }
            
            clear() {
                if (this.routing) this.map.removeControl(this.routing);
                if (this.startMarker) this.map.removeLayer(this.startMarker);
                if (this.destMarker) this.map.removeLayer(this.destMarker);
                
                this.routing = null;
                this.currentRoute = null;
                this.startMarker = null;
                this.destMarker = null;
                this.followMode = false;
                this.baseDuration = 0;
                
                document.getElementById('followBtn').style.background = '';
                document.getElementById('followBtn').style.color = '';
                document.getElementById('routeInfo').classList.add('hidden');
                document.getElementById('startNavBtn').classList.add('hidden');
                document.getElementById('startNavBtn').textContent = '🚀 START';
                document.getElementById('startNavBtn').style.background = '#4caf50';
                document.getElementById('fromInput').value = '';
                document.getElementById('toInput').value = '';
                document.getElementById('drivingMode').classList.add('hidden');
                
                this.notify('✖️ Cleared', 'info');
            }
            
            notify(msg, type) {
                const note = document.getElementById('notification');
                note.textContent = msg;
                note.style.borderColor = type === 'error' ? '#e31937' : type === 'success' ? '#4caf50' : '#3e6ae1';
                note.style.color = type === 'error' ? '#e31937' : type === 'success' ? '#4caf50' : '#3e6ae1';
                note.classList.remove('hidden');
                setTimeout(() => note.classList.add('hidden'), 4000);
            }
        }
        
        window.addEventListener('load', () => {
            window.nav = new TeslaNav();
        });
    </script>
</body>
</html>
